tools:
  consultar_fatura:
    description: Consulta dados resumidos de fatura por msisdn/invoice_id.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
      invoice_id: string
    selection_keywords:
    - fatura
    - conta
    - boleto
  consultar_pagamentos:
    description: Consulta histórico de pagamentos do cliente.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
    selection_keywords:
    - pagamento
    - pagamentos
  consultar_plano:
    description: Consulta plano ativo e atributos comerciais.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
      asset_id: string
    selection_keywords:
    - plano
  listar_servicos:
    description: Lista serviços ativos e adicionais VAS.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
    selection_keywords:
    - serviços
    - servicos
    - vas
  consultar_pedido:
    description: Consulta pedido de varejo por order_id/customer_id.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id: string
      customer_id: string
    selection_keywords:
    - consultar pedido
    - status do pedido
    - pedido
  consultar_entrega:
    description: Consulta entrega e rastreamento do pedido.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id: string
    selection_keywords:
    - entrega
    - rastreio
    - rastreamento
    - transportadora
    - previsão
  solicitar_troca:
    description: Simula abertura de solicitação de troca.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id: string
      reason: string
    selection_keywords:
    - solicitar troca
    - trocar
    - troca
    - defeito
    - quebrado
  solicitar_devolucao:
    description: Simula abertura de solicitação de devolução.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id: string
      reason: string
    selection_keywords:
    - solicitar devolução
    - solicitar devolucao
    - devolver pedido
    - devolver
    - devolução
    - devolucao
    - arrependimento
