tools:
  consultar_fatura:
    description: Consulta dados resumidos de fatura por msisdn/invoice_id.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
      invoice_id: string
    selection_keywords:
    - fatura
    - conta
    - boleto
    response:
      mode: renderer
      renderer: telecom.invoice
  consultar_pagamentos:
    description: Consulta histórico de pagamentos do cliente.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
    selection_keywords:
    - pagamento
    - pagamentos
  consultar_plano:
    description: Consulta plano ativo e atributos comerciais.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
      asset_id: string
    selection_keywords:
    - plano
    response:
      mode: renderer
      renderer: telecom.plan
  listar_servicos:
    description: Lista serviços ativos e adicionais VAS.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn: string
    selection_keywords:
    - serviços
    - servicos
    - vas
  consultar_pedido:
    description: Consulta pedido de varejo por order_id/customer_id.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id: string
      customer_id: string
    selection_keywords:
    - consultar pedido
    - status do pedido
    - pedido
    response:
      mode: renderer
      renderer: retail.order
  consultar_entrega:
    description: Consulta entrega e rastreamento do pedido.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id: string
    selection_keywords:
    - entrega
    - rastreio
    - rastreamento
    - transportadora
    - previsão
    response:
      mode: renderer
      renderer: retail.delivery
  validar_cancelamento_pedido:
    description: Pre-valida cancelamento do pedido sem executar efeitos transacionais.
    mcp_server: retail
    enabled: true
    tool_type: internal
    confirmation_required: false
    requires: [order_id]
    args_schema:
      order_id: string
      target_tool: string
    selection_keywords: []

  cancelar_pedido:
    description: Simula o cancelamento de um pedido de varejo.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    confirmation_required: true
    args_schema:
      order_id: string
    selection_keywords:
    - cancelar pedido
    - cancelamento do pedido
    - cancelar compra
    - cancelar a compra


  solicitar_troca:
    description: Simula abertura de solicitação de troca.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id: string
      reason: string
    selection_keywords:
    - solicitar troca
    - trocar
    - troca
    - defeito
    - quebrado
  solicitar_devolucao:
    description: Simula abertura de solicitação de devolução.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id: string
      reason: string
    selection_keywords:
    - solicitar devolução
    - solicitar devolucao
    - devolver pedido
    - devolver
    - devolução
    - devolucao
    - arrependimento
