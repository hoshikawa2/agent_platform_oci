tools:
  consultar_fatura:
    description: Consulta dados resumidos de fatura por msisdn/invoice_id.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn:
        type: string
        label: o número da linha
        description: Número da linha do cliente (MSISDN) usado para consultar informações de telecom.
        user_prompt: Informe o número da linha que deseja consultar.
      invoice_id:
        type: string
        label: o identificador da fatura
        description: Identificador da fatura que o cliente deseja consultar.
        user_prompt: Informe o identificador da fatura que deseja consultar.
    selection_keywords:
    - fatura
    - conta
    - boleto
  consultar_pagamentos:
    description: Consulta histórico de pagamentos do cliente.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn:
        type: string
        label: o número da linha
        description: Número da linha do cliente (MSISDN) usado para consultar informações de telecom.
        user_prompt: Informe o número da linha que deseja consultar.
    selection_keywords:
    - pagamento
    - pagamentos
  consultar_plano:
    description: Consulta plano ativo e atributos comerciais.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn:
        type: string
        label: o número da linha
        description: Número da linha do cliente (MSISDN) usado para consultar informações de telecom.
        user_prompt: Informe o número da linha que deseja consultar.
      asset_id:
        type: string
        label: o identificador do plano ou ativo
        description: Identificador do plano ou ativo comercial associado ao cliente.
        user_prompt: Informe o identificador do plano ou ativo que deseja consultar.
    selection_keywords:
    - plano
  listar_servicos:
    description: Lista serviços ativos e adicionais VAS.
    mcp_server: telecom
    enabled: true
    args_schema:
      msisdn:
        type: string
        label: o número da linha
        description: Número da linha do cliente (MSISDN) usado para consultar informações de telecom.
        user_prompt: Informe o número da linha que deseja consultar.
    selection_keywords:
    - serviços
    - servicos
    - vas
  consultar_pedido:
    description: Consulta pedido de varejo por order_id/customer_id.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido que o cliente deseja consultar.
        user_prompt: Informe o número do pedido que deseja consultar.
      customer_id:
        type: string
        label: a identificação do cliente
        description: Identificador do cliente associado ao pedido de varejo.
        user_prompt: Informe a identificação do cliente.
    selection_keywords:
    - consultar pedido
    - status do pedido
    - pedido
  consultar_entrega:
    description: Consulta entrega e rastreamento do pedido.
    mcp_server: retail
    enabled: true
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido cuja entrega ou rastreamento será consultado.
        user_prompt: Informe o número do pedido que deseja rastrear.
    selection_keywords:
    - entrega
    - rastreio
    - rastreamento
    - transportadora
    - previsão
  validar_cancelamento_pedido:
    description: Pre-valida cancelamento do pedido sem executar efeitos transacionais.
    mcp_server: retail
    enabled: true
    tool_type: internal
    confirmation_required: false
    requires: [order_id]
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido a ser pre-validado para cancelamento.
        user_prompt: Informe o número do pedido que deseja cancelar.
      target_tool:
        type: string
        label: a operação de destino
        description: Nome interno da operação transacional que será pre-validada; normalmente preenchido pelo runtime e 
          não solicitado ao usuário.
    selection_keywords: []

  cancelar_pedido:
    description: Simula o cancelamento de um pedido de varejo.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    confirmation_required: true
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido que o cliente deseja cancelar.
        user_prompt: Informe o número do pedido que deseja cancelar.
    selection_keywords:
    - cancelar pedido
    - cancelamento do pedido
    - cancelar compra
    - cancelar a compra


  solicitar_troca:
    description: Simula abertura de solicitação de troca.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido para o qual o cliente deseja solicitar troca.
        user_prompt: Informe o número do pedido que deseja trocar.
      reason:
        type: string
        label: o motivo da troca
        description: Motivo informado pelo cliente para solicitar a troca do pedido.
        user_prompt: Qual é o motivo da troca?
    selection_keywords:
    - solicitar troca
    - trocar
    - troca
    - defeito
    - quebrado
  solicitar_devolucao:
    description: Simula abertura de solicitação de devolução.
    mcp_server: retail
    enabled: true
    tool_type: action
    requires:
    - order_id
    - reason
    confirmation_required: true
    args_schema:
      order_id:
        type: string
        label: o número do pedido
        description: Identificador do pedido para o qual o cliente deseja solicitar devolução.
        user_prompt: Informe o número do pedido que deseja devolver.
      reason:
        type: string
        label: o motivo da devolução
        description: Motivo informado pelo cliente para solicitar a devolução do pedido.
        user_prompt: Qual é o motivo da devolução?
    selection_keywords:
    - solicitar devolução
    - solicitar devolucao
    - devolver pedido
    - devolver
    - devolução
    - devolucao
    - arrependimento
